<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('退学退费 - 驾校培训与考试管理系统')}"></head>
<body>
<div class="app">
    <main class="content">
        <h1 class="page-title">退学与退费</h1>

        <div class="alert alert-ok" th:if="${msg}" th:text="${msg}"></div>
        <div class="alert alert-err" th:if="${err}" th:text="${err}"></div>

        <div class="card" th:if="${canApply and myEnrollment != null}">
            <h2>提交退学申请 <span class="sub">提交后未来预约会被取消，处理中不能新增预约</span></h2>
            <form th:action="@{/withdrawals}" method="post" class="row-actions">
                <input name="reason" placeholder="请填写退学原因" required style="width:360px">
                <button class="btn btn-sm">提交申请</button>
            </form>
        </div>

        <div class="card">
            <h2>退学与退款记录</h2>
            <table>
                <thead>
                <tr><th>编号</th><th>学员</th><th>车型</th><th>实缴</th><th>状态</th><th>原因</th>
                    <th>核定金额</th><th>已退金额</th><th>操作</th></tr>
                </thead>
                <tbody>
                <tr th:each="w : ${withdrawals}">
                    <td th:text="${w.withdrawalId}">1</td>
                    <td th:text="${w.studentName}">学员</td>
                    <td th:text="${w.licenseType}">C1</td>
                    <td th:text="${w.paidAmount}">0</td>
                    <td><span class="tag" th:classappend="${w.status == 'REFUNDED'} ? 'tag-ok' : (${w.status == 'SUBMITTED'} ? 'tag-warn' : 'tag-off')" th:text="${w.status}">状态</span></td>
                    <td th:text="${w.reason}">原因</td>
                    <td th:text="${w.approvedRefundAmount} ?: '-'">-</td>
                    <td th:text="${w.refundAmount} ?: '-'">-</td>
                    <td class="row-actions">
                        <form th:if="${canReview and w.status == 'SUBMITTED'}"
                              th:action="@{/withdrawals/{id}/review(id=${w.withdrawalId})}" method="post">
                            <input type="hidden" name="action" value="approve">
                            <input type="number" step="0.01" min="0" name="approvedRefundAmount"
                                   th:value="${w.paidAmount}" style="width:100px" title="核定金额" required>
                            <input name="reviewNote" placeholder="核定意见" style="width:130px">
                            <button class="btn btn-sm">核定通过</button>
                        </form>
                        <form th:if="${canReview and w.status == 'SUBMITTED'}"
                              th:action="@{/withdrawals/{id}/review(id=${w.withdrawalId})}" method="post">
                            <input type="hidden" name="action" value="reject">
                            <input type="hidden" name="reviewNote" value="暂不符合退费条件">
                            <button class="btn btn-sm btn-line">驳回</button>
                        </form>
                        <form th:if="${canRefund and w.status == 'APPROVED'}"
                              th:action="@{/withdrawals/{id}/refund(id=${w.withdrawalId})}" method="post">
                            <select name="refundMethod">
                                <option value="线下转账">线下转账</option>
                                <option value="现金">现金</option>
                            </select>
                            <input name="refundVoucher" placeholder="退款凭证号" style="width:130px" required>
                            <button class="btn btn-sm">登记退款</button>
                        </form>
                        <form th:if="${canApply and w.status == 'REJECTED' and w.studentUserId == loginUser.userId}"
                              th:action="@{/withdrawals/{id}/resubmit(id=${w.withdrawalId})}" method="post">
                            <input name="reason" placeholder="修改原因后重提" required style="width:150px">
                            <button class="btn btn-sm btn-line">修改重提</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(withdrawals)}"><td colspan="9" class="muted">暂无数据</td></tr>
                </tbody>
            </table>
        </div>
        <p class="muted">核定金额不能超过报名实缴金额；财务一次登记与核定额相等的退款，结算后申请变为 REFUNDED、报名变为 WITHDRAWN，历史缴费、培训和答卷记录全部保留。</p>
    </main>
    <aside th:replace="~{layout :: sidebar}"></aside>
</div>
</body>
</html>
