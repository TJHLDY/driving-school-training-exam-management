<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('注册 - 驾校培训与考试管理系统')}"></head>
<body>
<div class="auth-wrap">
    <div class="auth-box">
        <h1>学员注册</h1>
        <p class="sub">系统只开放学员注册，其他角色由管理员分配</p>

        <div class="alert alert-err" th:if="${error}" th:text="${error}"></div>

        <form th:action="@{/register}" method="post">
            <div class="form-row">
                <label>用户名</label>
                <input name="username" required>
            </div>
            <div class="form-row">
                <label>密码</label>
                <input type="password" name="password" required minlength="6">
            </div>
            <div class="form-row">
                <label>真实姓名</label>
                <input name="realName" required>
            </div>
            <div class="form-row">
                <label>手机号</label>
                <input name="phone" required>
            </div>
            <div class="form-row">
                <label>身份证号</label>
                <input name="idNumber" required>
            </div>
            <div class="form-row">
                <label>性别</label>
                <select name="gender">
                    <option value="男">男</option>
                    <option value="女">女</option>
                </select>
            </div>
            <button class="btn btn-full">注册</button>
        </form>

        <p class="hint">已有账号？<a th:href="@{/login}">返回登录</a></p>
    </div>
</div>
</body>
</html>
