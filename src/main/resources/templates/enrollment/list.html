<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{layout :: head('报名与缴费 - 驾校培训与考试管理系统')}"></head>
<body>
<div class="app">
    <main class="content">
        <h1 class="page-title">报名与缴费</h1>

        <div class="alert alert-ok" th:if="${msg}" th:text="${msg}"></div>
        <div class="alert alert-err" th:if="${err}" th:text="${err}"></div>

        <div class="toolbar">
            <a class="btn btn-sm" th:if="${canApply}" th:href="@{/enrollments/new}">提交报名</a>
            <a class="btn btn-sm btn-line" th:href="@{/enrollments}">全部</a>
            <a class="btn btn-sm btn-line" th:href="@{/enrollments(status='SUBMITTED')}">待审核</a>
            <a class="btn btn-sm btn-line" th:href="@{/enrollments(status='APPROVED')}">待缴费</a>
            <a class="btn btn-sm btn-line" th:href="@{/enrollments(status='ACTIVE')}">已生效</a>
            <a class="btn btn-sm btn-line" th:href="@{/enrollments(status='REJECTED')}">已驳回</a>
        </div>

        <div class="card">
            <h2>报名及缴费记录</h2>
            <table>
                <thead>
                <tr>
                    <th>编号</th><th>学员</th><th>手机</th><th>车型</th>
                    <th>应缴</th><th>约定学时</th><th>状态</th>
                    <th>审核</th><th>缴费</th><th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="e : ${enrollments}">
                    <td th:text="${e.enrollmentId}">1</td>
                    <td th:text="${e.studentName}">学员</td>
                    <td th:text="${e.phone}">-</td>
                    <td th:text="${e.licenseType}">C1</td>
                    <td th:text="${e.requiredAmount}">0</td>
                    <td th:text="${e.plannedHours}">0</td>
                    <td><span class="tag" th:classappend="${e.status == 'ACTIVE'} ? 'tag-ok' : (${e.status == 'SUBMITTED'} ? 'tag-warn' : 'tag-off')" th:text="${e.status}">状态</span></td>
                    <td>
                        <span th:text="${e.reviewedByName} ?: '-'">-</span>
                        <div class="muted" th:text="${e.reviewNote} ?: ''"></div>
                    </td>
                    <td>
                        <span th:text="${e.paidAmount}">0</span>
                        <div class="muted" th:text="${e.paymentVoucher} ?: ''"></div>
                    </td>
                    <td class="row-actions">
                        <form th:if="${canReview and e.status == 'SUBMITTED'}"
                              th:action="@{/enrollments/{id}/review(id=${e.enrollmentId})}" method="post">
                            <input type="hidden" name="action" value="approve">
                            <input type="number" step="0.01" name="requiredAmount" th:value="${e.requiredAmount}" style="width:90px" title="应缴金额" required>
                            <input type="number" step="0.5" name="plannedHours" th:value="${e.plannedHours}" style="width:70px" title="约定学时" required>
                            <input name="reviewNote" placeholder="审核意见" style="width:110px">
                            <button class="btn btn-sm">通过</button>
                        </form>
                        <form th:if="${canReview and e.status == 'SUBMITTED'}"
                              th:action="@{/enrollments/{id}/review(id=${e.enrollmentId})}" method="post">
                            <input type="hidden" name="action" value="reject">
                            <input type="hidden" name="reviewNote" value="资料不齐，请修改后重新提交">
                            <button class="btn btn-sm btn-line">驳回</button>
                        </form>
                        <form th:if="${canPay and e.status == 'APPROVED'}"
                              th:action="@{/enrollments/{id}/pay(id=${e.enrollmentId})}" method="post">
                            <select name="paymentMethod">
                                <option value="线下转账">线下转账</option>
                                <option value="现金">现金</option>
                                <option value="刷卡">刷卡</option>
                            </select>
                            <input name="paymentVoucher" placeholder="凭证号" style="width:130px" required>
                            <button class="btn btn-sm">登记全额缴费</button>
                        </form>
                        <form th:if="${canApply and e.status == 'REJECTED' and e.studentUserId == loginUser.userId}"
                              th:action="@{/enrollments/{id}/resubmit(id=${e.enrollmentId})}" method="post">
                            <select name="licenseType">
                                <option value="C1">C1</option>
                                <option value="C2">C2</option>
                            </select>
                            <button class="btn btn-sm btn-line">修改重提</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(enrollments)}"><td colspan="10" class="muted">暂无数据</td></tr>
                </tbody>
            </table>
        </div>
        <p class="muted">状态流转：SUBMITTED → APPROVED / REJECTED；驳回后可修改原记录重提；财务一次登记全额缴费后转 ACTIVE；退费结算后转 WITHDRAWN。</p>
    </main>
    <aside th:replace="~{layout :: sidebar}"></aside>
</div>
</body>
</html>
